<header
  class="sticky top-0 z-40 border-b border-base-300/70 bg-base-100/80 backdrop-blur-xl"
>
  <nav
    class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6"
  >
    <!-- Logo -->
    <a routerLink="/dashboard" class="flex items-center gap-2.5">
      <span
        class="grid size-9 place-items-center rounded-xl bg-linear-to-br from-primary to-secondary text-base shadow-md shadow-primary/30"
        >⚡</span
      >
      <span
        class="bg-linear-to-r from-primary to-secondary bg-clip-text text-xl font-extrabold tracking-tight text-transparent"
        >Stashly</span
      >
    </a>

    <!-- Desktop links -->
    <ul class="hidden items-center gap-1 md:flex">
      <li>
        <a
          routerLink="/dashboard"
          class="nav-link"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          >Dashboard</a
        >
      </li>
      <li>
        <a routerLink="/groups" class="nav-link" routerLinkActive="active-link"
          >Groups</a
        >
      </li>
      <li>
        <a
          routerLink="/bookmarks"
          class="nav-link"
          routerLinkActive="active-link"
          >Bookmarks</a
        >
      </li>
    </ul>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="btn btn-ghost btn-circle"
        title="Toggle Dark Mode"
        (click)="toggleMode()"
      >
        {{ isDark() ? '☀️' : '🌙' }}
      </button>

      <button type="button" class="btn btn-primary btn-sm sm:btn-md">
        + Add Quick Link
      </button>

      <button
        type="button"
        class="btn btn-ghost btn-square text-xl md:hidden"
        aria-label="Toggle Menu"
        (click)="toggleMenu()"
      >
        {{ isMenuOpen() ? '✕' : '☰' }}
      </button>
    </div>
  </nav>

  @if (isMenuOpen()) {
    <div
      class="animate-slide-down border-t border-base-300/70 bg-base-100/95 px-4 py-3 md:hidden"
    >
      <ul class="flex flex-col gap-1">
        <li>
          <a
            routerLink="/dashboard"
            class="nav-link"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
            >Dashboard</a
          >
        </li>
        <li>
          <a
            routerLink="/groups"
            class="nav-link"
            routerLinkActive="active-link"
            (click)="closeMenu()"
            >Groups</a
          >
        </li>
        <li>
          <a
            routerLink="/bookmarks"
            class="nav-link"
            routerLinkActive="active-link"
            (click)="closeMenu()"
            >Bookmarks</a
          >
        </li>
      </ul>
    </div>
  }
</header>
