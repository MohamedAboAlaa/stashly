<app-navbar />

<main class="mx-auto w-full max-w-7xl px-4 py-8 sm:px-6">
  <router-outlet />
</main>

<app-modal
  [isOpen]="!!businessError.message()"
  size="sm"
  (close)="businessError.close()"
>
  <span modal-header>Notice</span>

  <p class="text-base-content/80">{{ businessError.message() }}</p>

  <div modal-footer>
    <button type="button" class="btn btn-primary" (click)="businessError.close()">
      Close
    </button>
  </div>
</app-modal>
